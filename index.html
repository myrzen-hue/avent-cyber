<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avent Cyber-Philo 2026</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            background: #111827;
            border: 2px solid #00ff66;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.2);
            max-width: 500px;
            text-align: center;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #38bdf8;
        }
        .subtitle {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 25px;
        }
        .quote-box {
            background: #030712;
            padding: 20px;
            border-left: 4px solid #38bdf8;
            margin-bottom: 20px;
            text-align: left;
            min-height: 80px;
            display: flex;
            align-items: center;
            font-style: italic;
        }
        button {
            background: #00ff66;
            color: #030712;
            border: none;
            padding: 10px 20px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.2s;
        }
        button:hover {
            background: #38bdf8;
        }
        .author {
            margin-top: 10px;
            font-weight: bold;
            color: #f43f5e;
            text-align: right;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>// ROOT/AVENT_2026.sh</h1>
        <div class="subtitle">Chargement de la charge utile philosophique...</div>
        
        <div class="quote-box" id="quoteDisplay">
            Clique sur le bouton ci-dessous pour décrypter la pensée du jour.
        </div>
        
        <div class="author" id="authorDisplay"></div>
        
        <button onclick="getDailyQuote()">Exécuter le décryptage</button>
    </div>

    <script>
        const citations = [
            { text: "La science ne cherche pas à expliquer, elle cherche à fournir un modèle mathématique de la réalité.", author: "John von Neumann" },
            { text: "Le doute est un état mental inconfortable, mais la certitude est ridicule.", author: "Voltaire" },
            { text: "Ce qui est affirmé sans preuve peut être nié sans preuve.", author: "Euclide / Christopher Hitchens" },
            { text: "On ne résout pas un problème avec les modes de pensée qui l'ont engendré.", author: "Albert Einstein" },
            { text: "Connais-toi toi-même, et tu connaîtras l'univers et les dieux.", author: "Socrate" },
            { text: "La sécurité n'est pas un produit, c'est un processus.", author: "Bruce Schneier" },
            { text: "Il n'y a point de vent favorable pour celui qui ne sait où il va.", author: "Sénèque" },
            { text: "L'intelligence est la capacité de s'adapter au changement.", author: "Stephen Hawking" }
        ];

        function getDailyQuote() {
            // Pour l'exemple, on pioche de façon aléatoire ou cyclique
            const randomIndex = Math.floor(Math.random() * citations.length);
            const selected = citations[randomIndex];
            
            document.getElementById("quoteDisplay").innerText = `"${selected.text}"`;
            document.getElementById("authorDisplay").innerText = `— ${selected.author}`;
        }
    </script>

</body>
</html>
